<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tay is gay 音效試聽板</title>
<style>
  body { margin: 0; padding: 20px 24px 60px; background: #14161a; color: #dfe3ea; font: 14px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; } h2 { font-size: 14px; margin: 22px 0 8px; color: #8fa3bd; font-weight: 600; letter-spacing: .05em; }
  p { margin: 0 0 12px; color: #8a919c; }
  .ctl { display: flex; flex-wrap: wrap; gap: 10px 22px; padding: 12px 14px; background: #1c1f25; border-radius: 10px; position: sticky; top: 0; z-index: 2; }
  .ctl label { display: flex; align-items: center; gap: 8px; white-space: nowrap; } .ctl output { min-width: 3.2em; color: #f5c26b; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 120px; } select { background: #262a32; color: inherit; border: 1px solid #3a404b; border-radius: 6px; padding: 3px 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button { background: #262a32; color: inherit; border: 1px solid #3a404b; border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover { background: #303640; } button:active { background: #f5c26b; color: #14161a; } button.on { border-color: #f5c26b; color: #f5c26b; }
  small { color: #7b838f; }
</style>
</head>
<body>
<h1>tay is gay 音效試聽板</h1>
<p>所有聲音都是 js/audio.js 即時合成的。先調上面的距離／左右／空間，再點下面的按鈕試聽（距離 0 = 自己發出的聲音）。</p>
<div class="ctl">
  <label>音量 <input id="vol" type="range" min="0" max="1" step="0.05" value="0.6"><output></output></label>
  <label>距離（公尺）<input id="dist" type="range" min="0" max="60" step="1" value="0"><output></output></label>
  <label>左右 <input id="pan" type="range" min="-1" max="1" step="0.1" value="0"><output></output></label>
  <label>殘響量 <input id="rev" type="range" min="0" max="1" step="0.05" value="0.3"><output></output></label>
  <label>殘響時間（秒）<input id="size" type="range" min="0.2" max="4" step="0.1" value="1.1"><output></output></label>
  <label>地面 <select id="surf"><option>concrete</option><option>metal</option><option>wood</option><option>dirt</option><option>sand</option><option>rock</option></select></label>
  <label>環境音 <select id="amb"><option value="">（無）</option><option>wind</option><option>harbor</option><option>desert</option><option>cave</option></select></label>
  <label><input id="auto" type="checkbox"> 槍聲連發 12 發</label>
</div>
<div id="board"></div>
<script type="module">
import { Sfx } from '../js/audio.js';
const sfx = window.sfx = new Sfx(), $ = (id) => document.getElementById(id), num = (id) => +$(id).value;
document.addEventListener('pointerdown', () => sfx.init(), true);
for (const id of ['vol', 'dist', 'pan', 'rev', 'size']) {
  const el = $(id), show = () => { el.nextElementSibling.textContent = (+el.value).toFixed(id === 'dist' ? 0 : 2); if (id === 'vol') sfx.setVolume(+el.value); if (id === 'rev' || id === 'size') sfx.setEnv({ reverb: num('rev'), size: num('size') }); };
  el.addEventListener('input', show); show();
}
$('amb').addEventListener('change', () => { sfx.init(); sfx.ambient($('amb').value || null); });
// 武器清單：讀得到 weapons.js 就用遊戲裡真正的數值，讀不到就每一類各放一把
const KINDS = { pistol: { f: 1800, dur: 0.12, thump: 180, gain: 0.6 }, smg: { f: 2200, dur: 0.1, thump: 210, gain: 0.6 }, rifle: { f: 1400, dur: 0.16, thump: 150, gain: 0.8 }, shotgun: { f: 800, dur: 0.3, thump: 90, gain: 1 }, sniper: { f: 700, dur: 0.42, thump: 70, gain: 1.1 }, lmg: { f: 1000, dur: 0.18, thump: 110, gain: 0.9 }, launcher: { f: 500, dur: 0.5, thump: 60, gain: 1 } };
let guns = Object.entries(KINDS).map(([k, s]) => [k, { ...s, kind: k }, 600]);
try { const { WEAPONS } = await import('../js/weapons.js'); guns = Object.values(WEAPONS).filter((w) => w.snd && w.snd.gain > 0).map((w) => [w.name, w.snd, w.rpm || 600]).concat(guns.map(([k, s]) => ['（類型）' + k, s, 600])); } catch (e) { console.warn('weapons.js 讀不到，改用內建清單', e); }
const D = () => num('dist'), P = () => num('pan'), S = () => $('surf').value;
const fire = (snd, rpm) => { const n = $('auto').checked ? 12 : 1; for (let i = 0; i < n; i++) setTimeout(() => { sfx.shot(snd, D(), P()); if (!D()) sfx.shell(0.3); }, i * 60000 / rpm); };
let burning = false, smoking = false;
const sections = [
  ['槍聲（依上方的距離與左右）', guns.map(([name, snd, rpm]) => [name, () => fire(snd, rpm)])],
  ['換彈與持槍', [['退彈匣', () => sfx.reload(0)], ['上彈匣＋拉槍機', () => sfx.reload(1)], ['中途喀聲', () => sfx.reload(2)], ['手槍換彈', () => { sfx.reload(0, 'pistol'); setTimeout(() => sfx.reload(1, 'pistol'), 700); }], ['霰彈槍塞彈＋泵動', () => { sfx.reload(0, 'shotgun'); setTimeout(() => sfx.reload(1, 'shotgun'), 500); }], ['狙擊槍換彈', () => { sfx.reload(0, 'sniper'); setTimeout(() => sfx.reload(1, 'sniper'), 900); }], ['空槍', () => sfx.dry()], ['切槍', () => sfx.swap()], ['彈殼落地', () => sfx.shell(0)]]],
  ['爆炸與投擲物（依距離與左右）', [['爆炸', () => sfx.explosion(D(), P())], ['大爆炸 ×2', () => sfx.explosion(D(), P(), 2)], ['小爆炸 ×0.5', () => sfx.explosion(D(), P(), 0.5)], ['閃光彈', () => sfx.flashbang(D(), P(), 0)], ['閃光彈（被閃 2.5 秒）', () => sfx.flashbang(D(), P(), 2.5)], ['煙霧彈', () => sfx.hiss(D(), P())], ['汽油彈', () => sfx.molotov(D(), P())], ['投擲', () => sfx.throw()], ['彈跳', () => sfx.bounce(D(), P())], ['方塊碎裂', () => sfx.blockBreak(D(), P())]]],
  ['子彈與近戰', [...['concrete', 'metal', 'wood', 'dirt', 'sand', 'rock', 'flesh'].map((s) => ['打到 ' + s, () => sfx.impact(s, D(), P())]), ['子彈擦過', () => sfx.whiz(P())], ['揮刀', () => sfx.knifeSwing()], ['刀砍到人', () => sfx.knifeHit(true)], ['刀砍到牆', () => sfx.knifeHit(false)]]],
  ['腳步（依上方的地面材質）', [['自己走 6 步', () => { for (let i = 0; i < 6; i++) setTimeout(() => sfx.step(S()), i * 330); }], ['對手走 6 步', () => { for (let i = 0; i < 6; i++) setTimeout(() => sfx.stepRemote(D(), P(), S()), i * 330); }], ['跳', () => sfx.jump()], ['落地', () => sfx.land(S())], ['對手落地', () => sfx.landRemote(D(), P(), S())]]],
  ['命中與狀態', [['命中', () => sfx.hit(false)], ['爆頭', () => sfx.hit(true)], ['擊殺', () => sfx.kill()], ['受傷', () => sfx.hurt()], ['重生', () => sfx.respawn()], ['回合開始', () => sfx.roundStart()], ['倒數（低）', () => sfx.beep(false)], ['倒數（高）', () => sfx.beep(true)], ['贏', () => sfx.win()], ['輸', () => sfx.lose()]]],
  ['介面與其他', [['點擊', () => sfx.ui()], ['購買', () => sfx.buy()], ['不能買', () => sfx.deny()], ['撿到', () => sfx.pickup()], ['噴漆', () => sfx.spray()], ['表情動作', () => sfx.emote()], ['語音按下', () => sfx.voiceBlip(true)], ['語音放開', () => sfx.voiceBlip(false)], ['壓低 2 秒（duck）', () => sfx.duck(0.9, 2)]]],
  ['循環音', [['火焰 開／關', (b) => { burning = !burning; b.classList.toggle('on', burning); sfx.loop('fire', 'fire', burning ? 1 / (1 + D() * 0.08) : 0, P()); }], ['噴煙 開／關', (b) => { smoking = !smoking; b.classList.toggle('on', smoking); sfx.loop('smoke', 'hiss', smoking ? 1 / (1 + D() * 0.08) : 0, P()); }], ['全部停掉', () => { sfx.stopLoops(); burning = smoking = false; document.querySelectorAll('button.on').forEach((b) => b.classList.remove('on')); }]]],
];
for (const [title, items] of sections) {
  const h = document.createElement('h2'), row = document.createElement('div'); h.textContent = title; row.className = 'row';
  for (const [label, fn] of items) { const b = document.createElement('button'); b.textContent = label; b.addEventListener('click', () => { sfx.init(); fn(b); }); row.append(b); }
  $('board').append(h, row);
}
// 火焰與噴煙跟著距離／左右滑桿即時更新
for (const id of ['dist', 'pan']) $(id).addEventListener('input', () => { if (burning) sfx.loop('fire', 'fire', 1 / (1 + D() * 0.08), P()); if (smoking) sfx.loop('smoke', 'hiss', 1 / (1 + D() * 0.08), P()); });
window.__board = true;
</script>
</body>
</html>
